<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" role="img" aria-label="Commits per project: DoctorCool 799, GOA 620, Rasry 287, Horizon Mini-ERP 225, BA-PMS 180, KaabaTrip 148, ZuTea 67, ZU ERP 31">
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .title { font-size: 20px; font-weight: 700; fill: #7C3AED; }
    .sub { font-size: 13px; fill: #8B949E; }
    .label { font-size: 14px; font-weight: 600; fill: #8B949E; }
    .count { font-size: 13px; font-weight: 700; fill: #8B949E; opacity: 0; animation: fade .4s ease-out forwards; }
    .bar { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow 1s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    @keyframes fade { to { opacity: 1; } }
  </style>

  <text class="title" x="400" y="28" text-anchor="middle">Where my commits went</text>
